<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Squircle App Icon background #0A0A0A -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  
  <!--
    SL Monogram:
    Top arch of S (horizontal rounded bar)
    Middle horizontal bridge extending left and right
    Vertical stem of L descending down
    Horizontal base of L extending right with angular wedge tail at bottom-right
  -->
  <g fill="#B91C1C">
    <!-- Top S curve / cap -->
    <path d="M 148 196
             C 148 166 172 144 206 144
             L 282 144
             C 312 144 332 162 332 188
             C 332 212 314 228 284 230
             L 148 230
             L 148 266
             L 284 266
             C 334 266 368 234 368 188
             C 368 142 332 108 280 108
             L 206 108
             C 152 108 112 148 112 198
             L 112 344
             L 148 344
             Z" />
    
    <!-- L stem and lower foot with angular wedge pointer -->
    <path d="M 230 230
             L 230 354
             L 348 354
             L 348 318
             L 384 372
             L 194 372
             L 194 230
             Z" />
  </g>
</svg>
