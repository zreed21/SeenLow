  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  
  <!--
    Red (#B91C1C) SL Emblem matching the image:
    Thick bold geometry (stroke-width ~36px equivalent in solid fills):
    1. Upper S:
       - Top horizontal bar starting around (200, 144) to (304, 144)
       - Top-left rounded curve dipping down to (148, 184)
       - Inner loop turning right at (148, 226) across to (272, 226)
       - Down & right round turn to (308, 262)
       - Lower curve of S turning left to (148, 262)
    2. Vertical L-stem:
       - Runs vertically down from the middle crossbar at X ~ 230 down to Y ~ 340
    3. Bottom horizontal L-arm:
       - Runs from X ~ 230 to X ~ 330 at Y ~ 340
       - Right corner features the triangular downward speech-tail pointer (beak) to (366, 364)
  -->
