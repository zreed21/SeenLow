<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <!--
    Wordmark: "SeenLow"
    "Seen" in Black/White (theme-aware or neutral #0A0A0A / currentColor)
    "Low" in Red (#B91C1C)
    The 'o' in 'Low' features the custom pupil/dot in the center (eye look: "seen low").
  -->
  <style>
    .text-seen { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 88px; letter-spacing: -2px; }
  </style>
  
  <g transform="translate(10, 88)">
    <!-- "Seen" in main text color -->
    <text class="text-seen" fill="#0A0A0A">Seen</text>
    
    <!-- "L" in #B91C1C -->
    <!-- Positioned after "Seen" (approx width 210px) -->
    <text class="text-seen" x="212" fill="#B91C1C">L</text>
    
    <!-- Custom stylized "o" with concentric eye pupil in #B91C1C -->
    <!-- Center of "o" roughly around X=295, Y=-28 -->
    <!-- Outer ring of 'o' -->
    <path fill="#B91C1C" fill-rule="evenodd" d="
      M 302,-58
      C 324,-58 340,-42 340,-26
      C 340,-10 324,4 302,4
      C 280,4 264,-10 264,-26
      C 264,-42 280,-58 302,-58
      Z
      M 302,-44
      C 290,-44 280,-36 280,-26
      C 280,-16 290,-8 302,-8
      C 314,-8 324,-16 324,-26
      C 324,-36 314,-44 302,-44
      Z
    " />
    <!-- Pupil dot in center of 'o' -->
    <circle cx="302" cy="-26" r="8" fill="#B91C1C" />
    
    <!-- "w" in #B91C1C -->
    <text class="text-seen" x="348" fill="#B91C1C">w</text>
  </g>
</svg>
